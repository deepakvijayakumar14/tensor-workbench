name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Kotlin, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit and integration tests (real PostgreSQL + SeaweedFS)
        run: ./gradlew test bootJar --console=plain
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: api-test-reports
          path: api/build/reports/tests

  worker:
    name: Worker (Python, NumPy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # this action publishes exact tags only
        with:
          version: "0.12.19"
      - run: uv sync --frozen
      - run: uv run pytest

  web:
    name: Web (React, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end acceptance (Docker Compose)
    runs-on: ubuntu-latest
    needs: [api, worker, web]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # this action publishes exact tags only
        with:
          version: "0.12.19"
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Acceptance checks
        working-directory: e2e
        run: uv sync --frozen && uv run pytest
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
