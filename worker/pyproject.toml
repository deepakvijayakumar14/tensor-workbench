[project]
name = "tensor-worker"
version = "0.1.0"
description = "Bounded NumPy worker pool for Tensor Workbench (synthetic workloads)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.5.3",
    "boto3==1.43.102",
    "requests==2.34.2",
]

[project.scripts]
tensor-worker = "tensor_worker.main:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensor_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
