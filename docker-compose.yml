# Tensor Workbench local stack. Development credentials only.
#
#   docker compose up --build --wait     # then open http://localhost:3000
#
# Published ports (localhost only):
#   3000  web UI + /api proxy
#   8333  SeaweedFS S3 endpoint, so browsers can follow presigned download URLs
# The API itself is not published: /internal worker endpoints stay on the Compose network.
name: tensor-workbench

x-storage-env: &storage-env
  STORAGE_ENDPOINT: http://seaweedfs:8333
  STORAGE_BUCKET: ${STORAGE_BUCKET:-tensor-workbench}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-workbench-dev}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-workbench-dev-secret}
  STORAGE_REGION: us-east-1

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d workbench"]
      interval: 3s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # Single-node "mini" mode: master, volume, filer and S3 gateway in one process.
    # S3_BUCKET creates the development bucket on startup.
    command: ["mini", "-dir=/data", "-webdav=false", "-admin.ui=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-workbench-dev}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-workbench-dev-secret}
      S3_BUCKET: ${STORAGE_BUCKET:-tensor-workbench}
    ports:
      - "127.0.0.1:${STORAGE_PUBLIC_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  api:
    build: ./api
    environment:
      <<: *storage-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/workbench
      DATABASE_USER: ${POSTGRES_USER:-workbench}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-workbench}
      # Presigned URLs are signed for the host the browser can reach, not the container name.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:8333}
      WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-token}
      QUEUE_LEASE_DURATION: ${QUEUE_LEASE_DURATION:-15s}
      QUEUE_HEARTBEAT_INTERVAL: ${QUEUE_HEARTBEAT_INTERVAL:-5s}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-3}
      ALLOW_FAULT_INJECTION: ${ALLOW_FAULT_INJECTION:-true}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  worker:
    build: ./worker
    init: true
    environment:
      <<: *storage-env
      API_URL: http://api:8080
      WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-token}
      WORKER_SLOTS: ${WORKER_SLOTS:-3}
      # Synthetic per-run delay so bounded scheduling is visible. Set to 0 for raw speed.
      WORKER_SYNTHETIC_DELAY_SECONDS: ${WORKER_SYNTHETIC_DELAY_SECONDS:-3}
      WORKER_INSTANCE_ID: worker
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 15s

  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  seaweedfs-data:
